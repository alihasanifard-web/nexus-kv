[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-kv"
version = "0.1.0"
authors = [
  { name="Ali Hasanifard", email="hasanifardalipa@gmail.com" },
]
description = "Official high-performance Python client for NexusKV distributed Raft and LSM-Tree storage engine"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["nexus-kv", "database", "redis", "raft", "lsm-tree", "distributed-storage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Database",
]

[project.urls]
"Homepage" = "https://github.com/alihasanifard-web/nexus-kv"
"Bug Tracker" = "https://github.com/alihasanifard-web/nexus-kv/issues"
