[package]
name = "nexus-kv"
version = "0.1.0"
edition = "2021"
authors = ["Ali Hasanifard <hasanifardalipa@gmail.com>"]
description = "High-Performance Distributed Fault-Tolerant Key-Value Store with Custom Raft Consensus & LSM-Tree Engine"
license = "MIT"
readme = "README.md"
repository = "https://github.com/alihasanifard-web/nexus-kv"
homepage = "https://github.com/alihasanifard-web/nexus-kv"
documentation = "https://docs.rs/nexus-kv"
keywords = ["database", "raft", "lsm-tree", "distributed", "redis"]
categories = ["database-implementations", "data-structures", "network-programming"]

[dependencies]
bytes = "1.6"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
parking_lot = "0.12"
tokio = { version = "1.38", features = ["full"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3.10"
