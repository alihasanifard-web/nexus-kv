name: Multi-Platform Automated Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nexus-kv-linux-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nexus-kv-macos-arm64
            ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: nexus-kv-macos-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nexus-kv-windows-x86_64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build All Release Binaries
        run: cargo build --release --target ${{ matrix.target }} --bins

      - name: Package Binaries (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/nexus-kv staging/nexus-kv
          cp target/${{ matrix.target }}/release/nexus_cli staging/nexus-cli
          cp target/${{ matrix.target }}/release/nexus_bench staging/nexus-bench
          cp target/${{ matrix.target }}/release/nexus_dashboard staging/nexus-dashboard
          cd staging
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz *
          shasum -a 256 ../${{ matrix.artifact_name }}.tar.gz > ../${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Package Binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/nexus-kv.exe staging/nexus-kv.exe
          cp target/${{ matrix.target }}/release/nexus_cli.exe staging/nexus-cli.exe
          cp target/${{ matrix.target }}/release/nexus_bench.exe staging/nexus-bench.exe
          cp target/${{ matrix.target }}/release/nexus_dashboard.exe staging/nexus-dashboard.exe
          cd staging
          7z a ../${{ matrix.artifact_name }}.zip *
          certutil -hashfile ../${{ matrix.artifact_name }}.zip SHA256 > ../${{ matrix.artifact_name }}.zip.sha256

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
