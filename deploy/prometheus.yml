# ==============================================================================
# 📊 PROMETHEUS SCRAPING SPECIFICATION FOR NEXUS-KV CLUSTER
# Architect: Ali Hasanifard
# ==============================================================================

global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'nexus-kv-cluster'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'nexus-node-1:7379'
          - 'nexus-node-2:7380'
          - 'nexus-node-3:7381'
        labels:
          cluster: 'nexus-production'
          architect: 'ali-hasanifard'
