apiVersion: v1
kind: Service
metadata:
  name: nexus-kv-headless
  labels:
    app.kubernetes.io/name: nexus-kv
    app.kubernetes.io/part-of: nexus-cluster
spec:
  clusterIP: None
  ports:
    - name: resp
      port: 6379
      targetPort: 6379
    - name: telemetry
      port: 7379
      targetPort: 7379
  selector:
    app.kubernetes.io/name: nexus-kv
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-kv
  labels:
    app.kubernetes.io/name: nexus-kv
spec:
  type: ClusterIP
  ports:
    - name: resp
      port: 6379
      targetPort: 6379
    - name: telemetry
      port: 7379
      targetPort: 7379
  selector:
    app.kubernetes.io/name: nexus-kv
