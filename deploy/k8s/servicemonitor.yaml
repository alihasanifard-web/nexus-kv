apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nexus-kv-monitor
  labels:
    app.kubernetes.io/name: nexus-kv
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-kv
  endpoints:
    - port: telemetry
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s
